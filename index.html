<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kalkulyator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#12111c; --panel:#1a1927; --key:#232236; --key-hi:#2c2b44;
  --text:#ece9f7; --muted:#8a86a8; --op:#3a3570; --accent:#ffb48a; --accent-ink:#2a1a10;
  --danger:#ff8a9b;
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  display:grid;place-items:center;padding:16px;
  background:radial-gradient(900px 500px at 20% 0%,#201d38 0%,var(--bg) 60%);
  font-family:'Sora',system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--text);
}
.calc{
  width:100%;max-width:360px;padding:20px;border-radius:32px;background:var(--panel);
  box-shadow:0 30px 60px -20px rgba(0,0,0,.7),0 8px 16px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.05);
}
.screen{
  height:120px;padding:10px 14px 14px;margin-bottom:18px;border-radius:22px;background:#13121f;
  box-shadow:inset 0 4px 12px rgba(0,0,0,.55);
  display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-end;overflow:hidden;
}
.history{min-height:20px;font-size:.85rem;font-weight:300;color:var(--muted);white-space:nowrap}
.current{font-size:2.6rem;font-weight:300;letter-spacing:-.02em;white-space:nowrap;line-height:1.15;transition:font-size .15s}
.current.err{color:var(--danger);font-size:1.4rem}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
button{
  position:relative;overflow:hidden;height:66px;border:0;border-radius:20px;cursor:pointer;
  font:inherit;font-size:1.25rem;font-weight:400;color:var(--text);background:var(--key);
  box-shadow:0 6px 10px -4px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.06);
  transition:transform .12s cubic-bezier(.3,1.6,.5,1),box-shadow .12s,background .15s;
}
button:hover{background:var(--key-hi)}
button:active,button.press{transform:scale(.92);box-shadow:0 2px 4px -2px rgba(0,0,0,.7),inset 0 2px 6px rgba(0,0,0,.35)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
button.fn{color:var(--accent)}
button.op{background:var(--op);color:#fff}
button.op:hover{background:#463f88}
button.op.active{background:var(--accent);color:var(--accent-ink)}
button.eq{background:var(--accent);color:var(--accent-ink);font-weight:600}
button.eq:hover{background:#ffc3a3}
button.zero{grid-column:span 2}
.ripple{
  position:absolute;border-radius:50%;pointer-events:none;background:rgba(255,255,255,.28);
  transform:scale(0);animation:ripple .55s ease-out forwards;
}
@keyframes ripple{to{transform:scale(1);opacity:0}}
.pop{animation:pop .18s ease-out}
@keyframes pop{0%{transform:translateY(5px);opacity:.5}100%{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:380px){button{height:58px}.current{font-size:2.2rem}}
</style>
</head>
<body>
<main class="calc" aria-label="Kalkulyator">
  <div class="screen" aria-live="polite">
    <div class="history" id="history"></div>
    <div class="current" id="current">0</div>
  </div>
  <div class="keys" id="keys">
    <button class="fn" data-act="clear">AC</button>
    <button class="fn" data-act="sign">±</button>
    <button class="fn" data-act="percent">%</button>
    <button class="op" data-op="/" aria-label="bo'lish">÷</button>

    <button data-num="7">7</button><button data-num="8">8</button><button data-num="9">9</button>
    <button class="op" data-op="*" aria-label="ko'paytirish">×</button>

    <button data-num="4">4</button><button data-num="5">5</button><button data-num="6">6</button>
    <button class="op" data-op="-" aria-label="ayirish">−</button>

    <button data-num="1">1</button><button data-num="2">2</button><button data-num="3">3</button>
    <button class="op" data-op="+" aria-label="qo'shish">+</button>

    <button class="zero" data-num="0">0</button>
    <button data-act="dot">,</button>
    <button class="eq" data-act="equals">=</button>
  </div>
</main>

<script>
(() => {
  const cur = document.getElementById('current');
  const hist = document.getElementById('history');
  const SYM = {'+':'+','-':'−','*':'×','/':'÷'};
  let s = {value:'0', prev:null, op:null, fresh:false, error:false};

  const calc = (a, b, op) => {
    a = parseFloat(a); b = parseFloat(b);
    let r;
    if (op === '+') r = a + b;
    else if (op === '-') r = a - b;
    else if (op === '*') r = a * b;
    else if (op === '/') { if (b === 0) return null; r = a / b; }
    return parseFloat(r.toPrecision(12)); // 0.1+0.2 kabi xatolarni tuzatadi
  };

  const fmt = v => {
    if (v === 'Xato') return v;
    let [i, d] = String(v).split('.');
    const neg = i.startsWith('-');
    if (neg) i = i.slice(1);
    if (/e/i.test(i)) return (neg ? '-' : '') + i + (d ? ',' + d : '');
    i = i.replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
    return (neg ? '-' : '') + i + (d !== undefined ? ',' + d : '');
  };

  const render = () => {
    cur.textContent = fmt(s.value);
    cur.classList.toggle('err', s.error);
    const len = cur.textContent.length;
    cur.style.fontSize = s.error ? '' : (len > 14 ? '1.4rem' : len > 11 ? '1.8rem' : len > 8 ? '2.2rem' : '');
    hist.textContent = s.op ? `${fmt(s.prev)} ${SYM[s.op]}` : '';
    document.querySelectorAll('.op').forEach(b =>
      b.classList.toggle('active', !!s.op && s.fresh && b.dataset.op === s.op));
    cur.classList.remove('pop'); void cur.offsetWidth; cur.classList.add('pop');
  };

  const reset = () => { s = {value:'0', prev:null, op:null, fresh:false, error:false}; };

  const num = d => {
    if (s.error) reset();
    if (s.fresh) { s.value = '0'; s.fresh = false; }
    if (s.value.replace(/[-.]/g,'').length >= 15) return;
    s.value = s.value === '0' ? d : s.value + d;
  };

  const dot = () => {
    if (s.error) reset();
    if (s.fresh) { s.value = '0'; s.fresh = false; }
    if (!s.value.includes('.')) s.value += '.';
  };

  const setOp = op => {
    if (s.error) return;
    if (s.op && !s.fresh) {
      const r = calc(s.prev, s.value, s.op);
      if (r === null) return fail();
      s.prev = String(r); s.value = String(r);
    } else if (!s.op) {
      s.prev = s.value;
    }
    s.op = op; s.fresh = true;
  };

  const equals = () => {
    if (s.error || !s.op) return;
    const r = calc(s.prev, s.value, s.op);
    if (r === null) return fail();
    hist.textContent = `${fmt(s.prev)} ${SYM[s.op]} ${fmt(s.value)} =`;
    s = {value:String(r), prev:null, op:null, fresh:true, error:false};
    cur.textContent = fmt(s.value);
    cur.classList.remove('pop'); void cur.offsetWidth; cur.classList.add('pop');
    document.querySelectorAll('.op').forEach(b => b.classList.remove('active'));
    const len = cur.textContent.length;
    cur.style.fontSize = len > 14 ? '1.4rem' : len > 11 ? '1.8rem' : len > 8 ? '2.2rem' : '';
    return true;
  };

  const fail = () => { s = {value:'Xato', prev:null, op:null, fresh:true, error:true}; };

  const sign = () => {
    if (s.error || s.value === '0') return;
    s.value = s.value.startsWith('-') ? s.value.slice(1) : '-' + s.value;
  };

  const percent = () => {
    if (s.error) return;
    const v = parseFloat(s.value);
    const r = s.op && s.prev !== null ? parseFloat(s.prev) * v / 100 : v / 100;
    s.value = String(parseFloat(r.toPrecision(12)));
    s.fresh = false;
  };

  const back = () => {
    if (s.error) return reset();
    if (s.fresh) return;
    s.value = s.value.length > 1 && !(s.value.length === 2 && s.value.startsWith('-'))
      ? s.value.slice(0, -1) : '0';
  };

  const handle = (kind, val) => {
    let skip = false;
    if (kind === 'num') num(val);
    else if (kind === 'op') setOp(val);
    else if (val === 'dot') dot();
    else if (val === 'clear') reset();
    else if (val === 'sign') sign();
    else if (val === 'percent') percent();
    else if (val === 'back') back();
    else if (val === 'equals') skip = equals();
    if (!skip) render();
  };

  const keys = document.getElementById('keys');

  // Bosilganda to'lqin (ripple) animatsiyasi
  keys.addEventListener('pointerdown', e => {
    const b = e.target.closest('button');
    if (!b) return;
    const r = b.getBoundingClientRect();
    const size = Math.max(r.width, r.height) * 2;
    const el = document.createElement('span');
    el.className = 'ripple';
    el.style.cssText = `width:${size}px;height:${size}px;left:${e.clientX - r.left - size/2}px;top:${e.clientY - r.top - size/2}px`;
    b.appendChild(el);
    el.addEventListener('animationend', () => el.remove());
  });

  keys.addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b) return;
    if (b.dataset.num !== undefined) handle('num', b.dataset.num);
    else if (b.dataset.op) handle('op', b.dataset.op);
    else handle('act', b.dataset.act);
  });

  // Klaviatura qo'llab-quvvatlashi
  const flash = sel => {
    const b = document.querySelector(sel);
    if (!b) return;
    b.classList.add('press');
    setTimeout(() => b.classList.remove('press'), 120);
  };

  document.addEventListener('keydown', e => {
    const k = e.key;
    if (/^\d$/.test(k)) { handle('num', k); flash(`[data-num="${k}"]`); }
    else if (['+','-','*','/'].includes(k)) { e.preventDefault(); handle('op', k); flash(`[data-op="${k}"]`); }
    else if (k === '.' || k === ',') { handle('act', 'dot'); flash('[data-act="dot"]'); }
    else if (k === 'Enter' || k === '=') { e.preventDefault(); handle('act', 'equals'); flash('[data-act="equals"]'); }
    else if (k === 'Backspace') handle('act', 'back');
    else if (k === 'Escape' || k === 'Delete') { handle('act', 'clear'); flash('[data-act="clear"]'); }
    else if (k === '%') { handle('act', 'percent'); flash('[data-act="percent"]'); }
  });

  render();
})();
</script>
</body>
</html>
